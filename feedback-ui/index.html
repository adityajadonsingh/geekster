<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <section class="feedback w-full">
        <div class="container mx-auto">
            <div class="heading text-center">
                <h1 class="font-bold text-5xl">FeedBack UI</h1>
            </div>
            <div class="box mt-8 w-2/3 border px-10 pt-10 pb-20 mx-auto relative">
                <div class="flex items-center justify-between starting">
                    <div class="item">
                        <img src="./smile.png" alt="">
                        <div class="mt-3 text-center font-bold text-xl">Happy</div>
                    </div>
                    <div class="item">
                        <img src="./neutral.png" alt="">
                        <div class="mt-3 text-center font-bold text-xl">Netural</div>
                    </div>
                    <div class="item">
                        <img src="./sad.png" alt="">
                        <div class="mt-3 text-center font-bold text-xl">Unhappy</div>
                    </div>
                </div>
                <div class="btn absolute"><button id="btn">Submit</button></div>
                <div class="submited text-center">
                    
                </div>
            </div>
        </div>
    </section>
    <script src="./main.js"></script>
</body>
</html>
